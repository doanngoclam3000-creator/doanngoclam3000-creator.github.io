# Tai khoan ngan hang nhan tien nap (dung chung voi cac phan mem)
[vars]
NGAN_HANG = "MSB"
SO_TK = "96886693052700"
CHU_TK = "DOAN NGOC LAM"
NGUON = "https://phanmemtq.com"
# Goc cua link rut gon cho cong tac vien. Dat rieng vi phanmemtq.com la
# trang tinh tren GitHub Pages, khong tu chuyen huong duoc.
NEN_LINK = "https://go.ay-hu.workers.dev"
# Ma affiliate cua chu shop. Da nop don Shopee ngay 07/09/2026 bang tai khoan
# michaiphong, dang cho duyet (Shopee tra loi qua email trong 10 ngay lam viec).
# Duyet xong: vao affiliate.shopee.vn > Tai khoan cua toi, chep "Affiliate ID"
# (con goi la af_id) dan vao dong duoi roi bo dau # di, chay lai cai-dat.cjs.
# Bat len la TOAN BO link cong tac vien da tao truoc do tu dong ra tien,
# khong ai phai tao lai link.
# SHOPEE_AFF_ID = "..."
#
# AccessTrade: mang trung gian, mot tai khoan chay duoc CA Shopee lan TikTok Shop.
# BAT BUOC phai co neu muon link TikTok ra tien - TikTok khong cho gan tay ma
# affiliate vao link san pham nhu Shopee.
# Hai so nay lay tu chinh duong link cong cu Deep Link sinh ra:
#   go.isclix.com/deep_link/v6/<AT_PUB_ID>/<ma chien dich>
AT_PUB_ID = "7063328966579580240"
# TIKTOK SHOP CPS - da duyet 07/09/2026, hoa hong 20%/don.
AT_CD_TIKTOK = "6648523843406889655"
# Shopee Smartlink - nop 07/09/2026, dang CHO DUYET. Duyet xong vao chien dich
# bam "Tao link ngay", ma chien dich nam trong duong dan (campaign_id=...).
# AT_CD_SHOPEE = "..."
# Hoa hong san tra (% gia tri don, muc TOI DA - tuy nganh hang ma thap hon).
HH_TIKTOK = "20"
HH_SHOPEE = "24"
# Cong tac vien duoc huong bao nhieu PHAN TRAM cua so hoa hong do, con lai la
# cua chu shop. Doi so nay la trang web hien so tien moi ngay, khong phai sua ma.
#
# 75 nghia la: TikTok tra 20% gia tri don -> khach 15%, chu shop 5%.
#              Shopee tra 24%             -> khach 18%, chu shop 6%.
# Chia theo TI LE chu khong chot cung "khach duoc 15 diem", vi hoa hong that
# tuy nganh hang - gap mon chi tra 8% ma van cat cho khach 15 diem la chu shop
# bu tien tui.
CHIA_CTV = "75"
PHI_RUT = "0"
RUT_TOI_THIEU = "50000"
HOA_HONG = "10"
# Dia chi gui thu quen mat khau. PHAI la dia chi da xac minh ben Brevo,
# khong thi Brevo tu choi khong gui.
MAIL_TU = "Phần Mềm Việt <doanngoclam3000@gmail.com>"
# Client ID cua nut "Dang nhap bang Google" (du an doanlam tren Google Cloud).
# Chuoi nay cong khai, khong phai bi mat.
GOOGLE_CLIENT_ID = "158985395154-mg5spi6jkvk8636con1v12jap959lebs.apps.googleusercontent.com"

# Kho du lieu: D1 (SQLite). Tien bac PHAI dung D1 chu khong dung KV -
# KV la "eventually consistent", hai may chu doc cung luc ra so du cu.
[[d1_databases]]
binding = "DB"
database_name = "vi-phanmemtq"
database_id = "e0c7abe2-8615-47e0-8d9f-57170c029694"

# Noi thang sang ba may chu ban quyen.
# KHONG goi bang fetch tới dia chi workers.dev cua chung duoc: Cloudflare chan
# mot Worker goi HTTP sang Worker khac cung tai khoan (loi 1042). Buoc kieu nay
# thi loi goi di thang trong noi bo, khong ra Internet, va cung nhanh hon.
[[services]]
binding = "SV_BZ"
service = "cap-key-botzalo"

[[services]]
binding = "SV_ST"
service = "cap-key-shopee"

[[services]]
binding = "SV_PMO"
service = "cap-key-order"
