name: Phat hanh phan mem len Releases

# Chay tay tu tab Actions. Lay cac file cai dat dang nam trong public/tai
# roi tao ban phat hanh, de kho ma nguon khong phai chua file nang.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phat-hanh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tao cac ban phat hanh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          taoBan() {
            THE="$1"; TEN="$2"; GHICHU="$3"; shift 3
            CO=""
            for f in "$@"; do
              if [ -f "$f" ]; then CO="$CO $f"; else echo "Bo qua, khong thay: $f"; fi
            done
            if [ -z "$CO" ]; then echo "Khong co file nao cho $THE, bo qua"; return 0; fi
            if gh release view "$THE" >/dev/null 2>&1; then
              echo "Ban $THE da co, tai lai file"
              gh release upload "$THE" $CO --clobber
            else
              echo "Tao ban $THE"
              gh release create "$THE" $CO --title "$TEN" --notes "$GHICHU"
            fi
          }

          taoBan "bot-wechat-1.0" "Bot WeChat 1.0" \
            "Bản đầu tiên. AI trả lời khách WeChat, hẹn giờ nhắn nhóm, nhắn tin hàng loạt, đăng bài lên Bảng tin. Có bản cho macOS và Windows. Dùng thử miễn phí 7 ngày." \
            public/tai/BotWeChat-1.0.dmg public/tai/BotWeChat-1.0-Windows.exe

          taoBan "phan-mem-order-2.7" "Phần Mềm Order 2.7" \
            "Bản Windows và Android tự đọc được hành trình vận đơn. Đăng nhập 1688 một lần ngay trong phần mềm." \
            public/tai/PhanMemOrder-2.7.dmg public/tai/PhanMemOrder-2.7.0-Windows.zip public/tai/PhanMemOrder-2.7.0.apk

          taoBan "phan-mem-order-2.6" "Phần Mềm Order 2.6" \
            "Ví tiền, huỷ đơn, ảnh đính kèm. Có bản cho macOS, Windows và Android." \
            public/tai/PhanMemOrder-2.6.dmg public/tai/PhanMemOrder-2.6.0.apk

          taoBan "chinh-sua-anh-1.6" "Chỉnh Sửa Ảnh 1.6" \
            "Sửa lỗi ảnh bị tối, thêm trang điểm. Có bản cho macOS và Windows." \
            public/tai/ChinhSuaAnh-1.6.dmg public/tai/ChinhSuaAnh-1.6-Windows.exe

          taoBan "hoc-tieng-trung-mac-2.0" "Học Tiếng Trung — macOS 2.0" \
            "Bản đầy đủ tính năng cho máy Mac. Lần đầu mở phải bấm chuột phải rồi chọn Mở — xem hướng dẫn trên trang." \
            public/tai/HocTiengTrung-2.0.dmg

          taoBan "hoc-tieng-trung-windows-0.3" "Học Tiếng Trung — Windows 0.3" \
            "Thêm bài tập và lịch ôn thông minh FSRS-5. Giải nén rồi chạy file Setup để cài." \
            public/tai/HocTiengTrung-0.3.0-Windows.zip

          echo
          echo "===== Ket qua ====="
          gh release list
