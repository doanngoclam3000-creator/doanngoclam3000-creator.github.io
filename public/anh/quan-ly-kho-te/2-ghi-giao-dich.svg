  <text x="680" y="199" font-size="13" font-weight="600" fill="#1d2430">Khách</text>
  <text x="940" y="199" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="end">Anh Dũng ▾</text>
  <rect x="666" y="226" width="288" height="76" rx="14" fill="#ffffff" stroke="#dcdde0"/>
  <text x="680" y="252" font-size="12" fill="#66707e">Số tệ bán ra</text>
