<rect width="1200" height="760" fill="url(#nenAnh)"/>
<g>
  <circle cx="96" cy="104" r="34" fill="#7c3aed"/>
  <text x="96" y="116" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="152" y="116" font-size="33" font-weight="700" fill="#241a3d">Ghi một giao dịch</text>
  <text x="56" y="186" font-size="20.5" fill="#584f6e"><tspan>Bấm nút </tspan><tspan font-weight="700" fill="#241a3d">+</tspan><tspan>, nhập </tspan><tspan font-weight="700" fill="#241a3d">tên khách</tspan><tspan> và </tspan><tspan font-weight="700" fill="#241a3d">số tệ</tspan><tspan> cần bán.</tspan></text>
  <text x="56" y="260" font-size="20.5" fill="#584f6e"><tspan>Phần mềm hiện ngay số tiền Việt khách phải trả</tspan></text>
  <text x="56" y="297" font-size="20.5" fill="#584f6e"><tspan>và số tiền lãi bạn được — không phải bấm máy tính.</tspan></text>
  <text x="56" y="371" font-size="20.5" fill="#584f6e"><tspan>Bấm </tspan><tspan font-weight="700" fill="#241a3d">Lưu</tspan><tspan> là xong, giao dịch vào sổ luôn.</tspan></text>
</g>
<g filter="url(#bong)">
