  <path d="M 810.0 158.4 L 810.0 195.2 L 784.24 206.24 Z"
        fill="#dbeafe" opacity="0.9"/>
</g>
  <text x="810.0" y="266" font-size="21" font-weight="700" fill="#111827" text-anchor="middle">Phần Mềm Của Tôi</text>
  <text x="810.0" y="292" font-size="14" fill="#8e8e93" text-anchor="middle">Đoàn Ngọc Lâm</text>

  <rect x="674" y="320" width="272" height="76" rx="14" fill="#f2f3f6"/>
  <text x="692" y="348" font-size="13.5" font-weight="600" fill="#111827">Bản dựng thử nghiệm</text>
  <text x="692" y="372" font-size="12.5" fill="#6b7280">Phiên bản 2.0 · Hết hạn sau 90 ngày</text>

  
<g>
  <rect x="674" y="420" width="272" height="48" rx="24.0" fill="#0a84ff"/>
  <text x="810.0" y="450.12" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">CHẤP NHẬN</text>
</g>
  
<g>
  <rect x="674" y="484" width="272" height="48" rx="24.0" fill="#e9eaee"/>
  <text x="810.0" y="514.12" font-size="17" font-weight="700" fill="#0a84ff" text-anchor="middle">CÀI ĐẶT</text>
</g>

  <text x="810.0" y="562" font-size="12" fill="#9aa1ab" text-anchor="middle">Ứng dụng này đang trong quá trình thử nghiệm</text>
</g>

<g>
  <circle cx="908" cy="444" r="30" fill="#f59e0b" opacity="0.18"/>
