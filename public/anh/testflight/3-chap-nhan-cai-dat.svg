<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <linearGradient id="nen" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#eef2f8"/><stop offset="100%" stop-color="#dde5f0"/>
  </linearGradient>
  <linearGradient id="tf" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3aa9ff"/><stop offset="100%" stop-color="#0a72e8"/>
  </linearGradient>
  <linearGradient id="appicon" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#7c3aed"/>
  </linearGradient>
  <linearGradient id="as" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2ea7ff"/><stop offset="100%" stop-color="#0b5ed7"/>
  </linearGradient>
  <filter id="bong" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.20"/>
  </filter>
  <filter id="bongnho" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.16"/>
  </filter>
  <clipPath id="manhinh"><rect x="652" y="56" width="316" height="648" rx="34"/></clipPath>
</defs>
<rect width="1200" height="760" fill="url(#nen)"/>
<g>
  <circle cx="96" cy="104" r="34" fill="#2563eb"/>
  <text x="96" y="116" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="152" y="116" font-size="34" font-weight="700" fill="#0f172a">Chấp nhận và cài</text>
  <text x="56" y="186" font-size="21" fill="#475569"><tspan>TestFlight mở ra và hiện tên phần mềm.</tspan></text>
  <text x="56" y="262" font-size="21" fill="#475569"><tspan>Bấm </tspan><tspan font-weight="700" fill="#0f172a">CHẤP NHẬN</tspan><tspan> (Accept),</tspan></text>
  <text x="56" y="300" font-size="21" fill="#475569"><tspan>rồi bấm tiếp </tspan><tspan font-weight="700" fill="#0f172a">CÀI ĐẶT</tspan><tspan> (Install).</tspan></text>
  <text x="56" y="376" font-size="21" fill="#475569"><tspan>Chờ vài chục giây cho máy tải xong.</tspan></text>
  <text x="56" y="414" font-size="21" fill="#475569"><tspan font-weight="700" fill="#0f172a">Không cần nhập mật khẩu Apple ID.</tspan></text>
</g>
<g filter="url(#bong)">
  <rect x="640" y="44" width="340" height="672" rx="46" fill="#1b2431"/>
  <rect x="646" y="50" width="328" height="660" rx="41" fill="#0d131c"/>
  <rect x="652" y="56" width="316" height="648" rx="34" fill="#ffffff"/>
</g>
<rect x="758.0" y="68" width="104" height="30" rx="15" fill="#0d131c"/>
<g fill="#1f2937" font-size="14" font-weight="600">
  <text x="682" y="96">9:41</text>
</g>
<g fill="#1f2937">
  <rect x="896" y="80" width="17" height="11" rx="2.5" opacity="0.85"/>
  <rect x="920" y="79" width="26" height="13" rx="4" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.6"/>
  <rect x="923" y="81.5" width="18" height="8" rx="2" opacity="0.85"/>
</g>
<rect x="754.0" y="686" width="112" height="5" rx="2.5" fill="#0d131c" opacity="0.35"/>
<g clip-path="url(#manhinh)">
  <rect x="652" y="104" width="316" height="600" fill="#ffffff"/>
  
<g filter="url(#bongnho)">
  <rect x="764.0" y="140" width="92" height="92" rx="20.7" fill="url(#tf)"/>
  <path d="M 810.0 158.4 L 835.76 206.24 L 810.0 195.2 L 784.24 206.24 Z"
