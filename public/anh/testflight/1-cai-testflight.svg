  <text x="96" y="116" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="152" y="116" font-size="34" font-weight="700" fill="#0f172a">Cài TestFlight</text>
  <text x="56" y="186" font-size="21" fill="#475569"><tspan font-weight="700" fill="#0f172a">TestFlight là ứng dụng của chính Apple,</tspan></text>
  <text x="56" y="224" font-size="21" fill="#475569"><tspan>dùng để cài các phần mềm đang thử nghiệm.</tspan></text>
  <text x="56" y="300" font-size="21" fill="#475569"><tspan>Mở App Store trên iPhone, gõ</tspan></text>
  <text x="56" y="338" font-size="21" fill="#475569"><tspan font-weight="700" fill="#0f172a">“TestFlight”</tspan><tspan> vào ô tìm kiếm,</tspan></text>
  <text x="56" y="376" font-size="21" fill="#475569"><tspan>rồi bấm nút </tspan><tspan font-weight="700" fill="#0f172a">NHẬN</tspan><tspan> để tải về.</tspan></text>
  <text x="56" y="452" font-size="21" fill="#475569"><tspan>Hoàn toàn miễn phí và an toàn.</tspan></text>
</g>
