<text x="56" y="440" font-size="20" fill="#475569"><tspan>một phút, tạo lối tắt ngoài</tspan></text>
<text x="56" y="478" font-size="20" fill="#475569"><tspan>Desktop rồi tự mở.</tspan></text>
