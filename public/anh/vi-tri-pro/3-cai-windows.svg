<text x="56" y="296" font-size="20" fill="#475569"><tspan>① Bấm chữ </tspan><tspan font-weight="700" fill="#0f172a">More info</tspan><tspan>.</tspan></text>
<text x="56" y="334" font-size="20" fill="#475569"><tspan>② Bấm nút </tspan><tspan font-weight="700" fill="#0f172a">Run anyway</tspan><tspan>.</tspan></text>
