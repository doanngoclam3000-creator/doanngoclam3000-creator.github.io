<rect width="1200" height="760" fill="url(#nen)"/>
<circle cx="90" cy="104" r="34" fill="#0f9d8f"/>
<text x="90" y="116" font-size="34" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan>1</tspan></text>
<text x="142" y="116" font-size="32" fill="#0f172a" font-weight="700"><tspan>Cho phép chạy bộ cài</tspan></text>
<text x="56" y="190" font-size="20" fill="#475569"><tspan>Bấm đúp tệp vừa tải. Lần đầu</tspan></text>
