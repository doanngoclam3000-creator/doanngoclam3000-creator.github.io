  <text x="152" y="116" font-size="33" font-weight="700" fill="#241a3d">Học bằng thẻ từ</text>
  <text x="56" y="186" font-size="20.5" fill="#584f6e"><tspan>Mỗi thẻ có </tspan><tspan font-weight="700" fill="#241a3d">chữ Hán, pinyin, nghĩa tiếng Việt</tspan></text>
  <text x="56" y="223" font-size="20.5" fill="#584f6e"><tspan>và một câu ví dụ.</tspan></text>
  <text x="56" y="297" font-size="20.5" fill="#584f6e"><tspan>Chạm vào loa để nghe đọc. Muốn nghe chậm thì</tspan></text>
  <text x="56" y="334" font-size="20.5" fill="#584f6e"><tspan>giảm tốc độ trong cài đặt.</tspan></text>
  <text x="56" y="408" font-size="20.5" fill="#584f6e"><tspan>Trả lời xong bấm mức độ nhớ — app dùng đó để</tspan></text>
  <text x="56" y="445" font-size="20.5" fill="#584f6e"><tspan font-weight="700" fill="#241a3d">tính ngày ôn lại</tspan><tspan>, từ nào hay sai sẽ hiện lại nhiều hơn.</tspan></text>
</g>
