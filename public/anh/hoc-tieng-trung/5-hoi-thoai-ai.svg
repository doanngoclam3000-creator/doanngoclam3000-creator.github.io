<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <linearGradient id="nenAnh" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8f5ff"/><stop offset="100%" stop-color="#ece3fb"/>
  </linearGradient>
  <filter id="bong" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#3b2560" flood-opacity="0.22"/>
  </filter>
  <filter id="bongnho" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#3b2560" flood-opacity="0.16"/>
  </filter>
  <clipPath id="manhinh"><rect x="652" y="56" width="316" height="648" rx="34"/></clipPath>
</defs>
<rect width="1200" height="760" fill="url(#nenAnh)"/>
<g>
  <circle cx="96" cy="104" r="34" fill="#7c3aed"/>
  <text x="96" y="116" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="152" y="116" font-size="33" font-weight="700" fill="#241a3d">Hội thoại với AI</text>
  <text x="56" y="186" font-size="20.5" fill="#584f6e"><tspan>Trò chuyện tự do bằng tiếng Trung. Điểm khác biệt:</tspan></text>
  <text x="56" y="223" font-size="20.5" fill="#584f6e"><tspan>AI </tspan><tspan font-weight="700" fill="#241a3d">chỉ dùng những từ bạn đã học</tspan><tspan>, nên bạn luôn hiểu.</tspan></text>
  <text x="56" y="297" font-size="20.5" fill="#584f6e"><tspan>Không hiểu câu nào thì chạm vào để hiện pinyin</tspan></text>
  <text x="56" y="334" font-size="20.5" fill="#584f6e"><tspan>và nghĩa tiếng Việt ngay tại chỗ.</tspan></text>
  <text x="56" y="408" font-size="20.5" fill="#584f6e"><tspan>Muốn tập tình huống cụ thể thì vào </tspan><tspan font-weight="700" fill="#241a3d">Nhập vai</tspan><tspan> —</tspan></text>
  <text x="56" y="445" font-size="20.5" fill="#584f6e"><tspan>ví dụ mặc cả với xưởng, hỏi tồn kho, giục hàng.</tspan></text>
</g>
<g filter="url(#bong)">
  <rect x="640" y="44" width="340" height="672" rx="46" fill="#2a2136"/>
  <rect x="646" y="50" width="328" height="660" rx="41" fill="#181022"/>
  <rect x="652" y="56" width="316" height="648" rx="34" fill="#f5f5f6"/>
</g>
<rect x="758.0" y="68" width="104" height="30" rx="15" fill="#181022"/>
<text x="682" y="96" font-size="14" font-weight="600" fill="#1d2430">9:41</text>
<g fill="#1d2430">
  <rect x="896" y="80" width="17" height="11" rx="2.5" opacity="0.85"/>
  <rect x="920" y="79" width="26" height="13" rx="4" fill="none" stroke="#1d2430" stroke-width="1.6" opacity="0.6"/>
  <rect x="923" y="81.5" width="18" height="8" rx="2" opacity="0.85"/>
</g>
<rect x="754.0" y="686" width="112" height="5" rx="2.5" fill="#181022" opacity="0.35"/><g clip-path="url(#manhinh)"><rect x="652" y="104" width="316" height="600" fill="#f5f5f6"/>
  <text x="670" y="148" font-size="26" font-weight="700" fill="#1d2430">Hội thoại</text>
  <text x="670" y="172" font-size="12.5" fill="#66707e">Vai: chủ xưởng áo Quảng Châu</text>
  <rect x="666" y="194" width="212" height="62" rx="15" fill="#ffffff" stroke="#dcdde0"/>
  <text x="682" y="220" font-size="15" fill="#1d2430">你要多少件？</text>
  <text x="682" y="240" font-size="10.5" fill="#66707e">nǐ yào duō shao jiàn — Bạn lấy bao nhiêu cái?</text>
  <rect x="748" y="270" width="206" height="44" rx="15" fill="#2e9e63"/>
  <text x="764" y="296" font-size="15" fill="#ffffff">我要二十件。</text>
  <rect x="666" y="328" width="228" height="62" rx="15" fill="#ffffff" stroke="#dcdde0"/>
  <text x="682" y="354" font-size="15" fill="#1d2430">好的，明天发货。</text>
  <text x="682" y="374" font-size="10.5" fill="#66707e">hǎo de, míng tiān fā huò — Được, mai giao hàng.</text>
  <rect x="666" y="406" width="288" height="44" rx="13" fill="#f2f8f4" stroke="#dcdde0"/>
  <text x="680" y="426" font-size="11" font-weight="700" fill="#2e9e63">Toàn bộ từ trong đoạn này bạn đã học</text>
  <text x="680" y="442" font-size="10.5" fill="#66707e">发货 · 明天 · 多少 · 件</text>
  <rect x="666" y="620" width="284" height="42" rx="21" fill="#ffffff" stroke="#dcdde0"/>
  <text x="686" y="647" font-size="12.5" fill="#66707e">Nhắn tiếng Trung…</text>
</g>
  <rect x="660" y="400" width="300" height="56" rx="16" fill="none" stroke="#f59e0b" stroke-width="3"/>
</svg>
