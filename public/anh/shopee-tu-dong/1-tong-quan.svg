  <g><rect x="88" y="600" width="1024" height="74" rx="14" fill="#f2fbf3" stroke="#bfe6c4"/><text x="118" y="644" font-size="24">✅</text><text x="156" y="636" font-size="17" font-weight="700" fill="#1e6b34">Đăng nhập một lần cho mỗi shop — thêm bao nhiêu shop cũng được</text><text x="156" y="662" font-size="14.5" fill="#4a7a56">Mật khẩu cất trong Keychain của máy, không lưu trần trong file.</text></g>
