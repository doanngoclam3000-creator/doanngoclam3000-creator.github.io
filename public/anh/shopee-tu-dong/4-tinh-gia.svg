<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <linearGradient id="nen4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fff1ec"/><stop offset="100%" stop-color="#ffe0d5"/></linearGradient>
  <filter id="bong4" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#7a2412" flood-opacity="0.18"/></filter>
</defs>
<rect width="1200" height="700" fill="url(#nen4)"/>
<text x="56" y="86" font-size="30" font-weight="700" fill="#3d1409">🧮 Tính giá bán — biết lãi thực sau khi Shopee trừ phí</text>
<text x="56" y="128" font-size="19.5" fill="#6b4a3f">Nhập giá vốn và các mức phí, phần mềm tính ra lãi mỗi đơn và gợi ý nên bán giá nào.</text>
<!-- Trai: nhap -->
<g filter="url(#bong4)">
  <rect x="56" y="160" width="520" height="480" rx="20" fill="#ffffff"/>
  <text x="84" y="204" font-size="18" font-weight="700" fill="#3d1409">💰 Vốn &amp; giá</text>
  <text x="84" y="244" font-size="14.5" fill="#777">Giá nhập (vốn)</text><rect x="330" y="226" width="170" height="32" rx="8" fill="#f7f7f7" stroke="#e3e3e3"/><text x="346" y="248" font-size="14" fill="#333">50.000đ</text>
  <text x="84" y="288" font-size="14.5" fill="#777">Giá bán dự tính</text><rect x="330" y="270" width="170" height="32" rx="8" fill="#f7f7f7" stroke="#e3e3e3"/><text x="346" y="292" font-size="14" fill="#333">99.000đ</text>
  <text x="84" y="336" font-size="18" font-weight="700" fill="#3d1409">📉 Phí Shopee trừ (%)</text>
  <text x="84" y="374" font-size="14" fill="#777">Phí thanh toán</text><rect x="240" y="358" width="70" height="28" rx="7" fill="#f7f7f7" stroke="#e3e3e3"/><text x="256" y="378" font-size="13.5" fill="#333">5</text>
  <text x="340" y="374" font-size="14" fill="#777">Hoa hồng</text><rect x="470" y="358" width="70" height="28" rx="7" fill="#f7f7f7" stroke="#e3e3e3"/><text x="486" y="378" font-size="13.5" fill="#333">4</text>
  <text x="84" y="414" font-size="14" fill="#777">Thuế</text><rect x="240" y="398" width="70" height="28" rx="7" fill="#f7f7f7" stroke="#e3e3e3"/><text x="256" y="418" font-size="13.5" fill="#333">1.5</text>
  <text x="340" y="414" font-size="14" fill="#777">Quảng cáo</text><rect x="470" y="398" width="70" height="28" rx="7" fill="#f7f7f7" stroke="#e3e3e3"/><text x="486" y="418" font-size="13.5" fill="#333">0</text>
  <rect x="84" y="452" width="456" height="60" rx="12" fill="#fff8f5" stroke="#ffdccd"/>
  <text x="104" y="478" font-size="13" fill="#a06a55">Phí cố định đổi theo ngành hàng — lưu được mức phí</text>
  <text x="104" y="498" font-size="13" fill="#a06a55">theo từng ngành để lần sau chọn nhanh.</text>
  <rect x="84" y="530" width="280" height="34" rx="8" fill="#f7f7f7" stroke="#e3e3e3"/><text x="98" y="553" font-size="13.5" fill="#555">💾 Thiết Bị Âm Thanh ▾</text>
</g>
<!-- Phai: ket qua -->
<g filter="url(#bong4)">
  <rect x="600" y="160" width="544" height="480" rx="20" fill="#ffffff"/>
  <text x="628" y="204" font-size="18" font-weight="700" fill="#3d1409">📊 Kết quả</text>
  <g font-size="15">
    <text x="628" y="248" fill="#555">Giá bán</text><text x="1112" y="248" fill="#3d1409" font-weight="700" text-anchor="end">99.000đ</text>
    <text x="628" y="282" fill="#555">Shopee trừ phí (9%)</text><text x="1112" y="282" fill="#c0392b" text-anchor="end">− 8.910đ</text>
    <text x="628" y="316" fill="#555">Thuế (1,5%)</text><text x="1112" y="316" fill="#c0392b" text-anchor="end">− 1.485đ</text>
    <line x1="628" y1="334" x2="1112" y2="334" stroke="#eee"/>
    <text x="628" y="366" fill="#3d1409" font-weight="700">Tiền Shopee trả về</text><text x="1112" y="366" fill="#3d1409" font-weight="700" text-anchor="end">88.605đ</text>
    <text x="628" y="400" fill="#555">Giá nhập</text><text x="1112" y="400" fill="#c0392b" text-anchor="end">− 50.000đ</text>
  </g>
  <rect x="628" y="422" width="484" height="70" rx="14" fill="#f2fbf3" stroke="#bfe6c4"/>
  <text x="652" y="456" font-size="17" font-weight="700" fill="#1e6b34">LÃI / sản phẩm</text>
  <text x="1088" y="466" font-size="26" font-weight="800" fill="#1e8e3e" text-anchor="end">35.605đ</text>
  <text x="652" y="480" font-size="13" fill="#4a7a56">36% giá bán · 71% vốn</text>
  <rect x="628" y="510" width="484" height="100" rx="14" fill="#fff5f2" stroke="#ffd0be"/>
  <text x="652" y="544" font-size="16" font-weight="700" fill="#ee4d2d">🎯 Muốn lãi 30% thì nên bán:</text>
  <text x="1088" y="580" font-size="30" font-weight="800" fill="#ee4d2d" text-anchor="end">106.000đ</text>
  <text x="652" y="592" font-size="13" fill="#a06a55">đã làm tròn lên nghìn — bấm để đưa vào ô giá bán</text>
</g>
</svg>
