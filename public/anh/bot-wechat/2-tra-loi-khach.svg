<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <linearGradient id="nenAnh" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8f5ff"/><stop offset="100%" stop-color="#ece3fb"/>
  </linearGradient>
  <filter id="bong" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#3b2560" flood-opacity="0.22"/>
  </filter>
  <filter id="bongnho" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#3b2560" flood-opacity="0.16"/>
  </filter>
  <clipPath id="manhinh"><rect x="652" y="56" width="316" height="648" rx="34"/></clipPath>
</defs>
<rect width="1200" height="760" fill="url(#nenAnh)"/>
<g>
  <circle cx="96" cy="104" r="34" fill="#7c3aed"/>
  <text x="96" y="116" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="152" y="116" font-size="33" font-weight="700" fill="#241a3d">Dạy bot cách trả lời</text>
  <text x="56" y="186" font-size="20.5" fill="#584f6e"><tspan>Viết một đoạn mô tả vai trò cho bot, ví dụ:</tspan></text>
  <text x="56" y="223" font-size="20.5" fill="#584f6e"><tspan font-weight="700" fill="#241a3d">"Bạn là nhân viên tư vấn của shop, trả lời ngắn</tspan></text>
  <text x="56" y="260" font-size="20.5" fill="#584f6e"><tspan font-weight="700" fill="#241a3d">gọn, không được bịa giá."</tspan></text>
  <text x="56" y="334" font-size="20.5" fill="#584f6e"><tspan>Bot theo đó mà làm, và </tspan><tspan font-weight="700" fill="#241a3d">nhớ 20 lượt gần nhất</tspan><tspan> với</tspan></text>
  <text x="56" y="371" font-size="20.5" fill="#584f6e"><tspan>từng người nên khách hỏi lại chuyện cũ vẫn trả lời được.</tspan></text>
  <text x="56" y="445" font-size="20.5" fill="#584f6e"><tspan>Sau một tiếng không nhắn thì tự quên, để chuyện cũ</tspan></text>
  <text x="56" y="482" font-size="20.5" fill="#584f6e"><tspan>không lẫn vào chuyện mới.</tspan></text>
</g>
<g filter="url(#bong)">
  <rect x="552" y="128" width="616" height="496" rx="14" fill="#ffffff" stroke="#dcdde0"/>
  <rect x="552" y="128" width="616" height="38" rx="14" fill="#f1f0f4"/>
  <rect x="552" y="152" width="616" height="14" fill="#f1f0f4"/>
  <circle cx="574" cy="147" r="6" fill="#ff5f57"/>
  <circle cx="594" cy="147" r="6" fill="#febc2e"/>
  <circle cx="614" cy="147" r="6" fill="#28c840"/>
  <text x="860.0" y="152" font-size="13" font-weight="600" fill="#1d2430" text-anchor="middle">Bot WeChat</text>
  <line x1="552" y1="166" x2="1168" y2="166" stroke="#dcdde0"/>
</g>
  <rect x="553" y="167" width="168" height="456" fill="#f7f8fa"/>
  <line x1="720" y1="167" x2="720" y2="624" stroke="#dcdde0"/>
  <text x="576" y="208" font-size="13">◉</text>
  <text x="598" y="207" font-size="11.5" font-weight="500" fill="#66707e">Tổng quan</text>
  <rect x="560" y="228" width="152" height="36" rx="9" fill="#0ea5e9" opacity="0.14"/>
  <text x="576" y="252" font-size="13">💬</text>
  <text x="598" y="251" font-size="11.5" font-weight="700" fill="#0ea5e9">Trả lời khách</text>
  <text x="576" y="296" font-size="13">⏰</text>
  <text x="598" y="295" font-size="11.5" font-weight="500" fill="#66707e">Hẹn giờ nhắn nhóm</text>
  <text x="576" y="340" font-size="13">📣</text>
  <text x="598" y="339" font-size="11.5" font-weight="500" fill="#66707e">Nhắn hàng loạt</text>
  <text x="576" y="384" font-size="13">📰</text>
  <text x="598" y="383" font-size="11.5" font-weight="500" fill="#66707e">Bảng tin</text>
  <text x="576" y="428" font-size="13">🔑</text>
  <text x="598" y="427" font-size="11.5" font-weight="500" fill="#66707e">Bản quyền</text>
  <text x="740" y="200" font-size="17" font-weight="700" fill="#1d2430">Trả lời khách</text>
  <text x="740" y="228" font-size="11.5" font-weight="700" fill="#66707e">BOT ĐÓNG VAI GÌ</text>
  <rect x="740" y="238" width="406" height="96" rx="11" fill="#ffffff" stroke="#dcdde0"/>
  <text x="756" y="262" font-size="11.5" fill="#1d2430">Bạn là nhân viên tư vấn của shop bán quần áo</text>
  <text x="756" y="283" font-size="11.5" fill="#1d2430">nhập từ Quảng Châu. Trả lời ngắn gọn, thân</text>
  <text x="756" y="304" font-size="11.5" fill="#1d2430">thiện. Không được bịa giá — chưa biết giá thì</text>
  <text x="756" y="325" font-size="11.5" fill="#1d2430">nói sẽ hỏi lại chủ shop.</text>
  <text x="740" y="366" font-size="11.5" font-weight="700" fill="#66707e">CHỈ TRẢ LỜI NHỮNG NGƯỜI NÀY</text>
  <rect x="740" y="378" width="406" height="34" rx="9" fill="#ffffff" stroke="#dcdde0"/>
  <text x="756" y="400" font-size="11.5" fill="#1d2430">Chị Lan — khách lẻ</text>
  <rect x="1082" y="382" width="46" height="26" rx="13" fill="#2e9e63"/>
  <circle cx="1115" cy="395" r="10" fill="#ffffff"/>
  <rect x="740" y="420" width="406" height="34" rx="9" fill="#ffffff" stroke="#dcdde0"/>
  <text x="756" y="442" font-size="11.5" fill="#1d2430">Anh Phú — khách sỉ</text>
  <rect x="1082" y="424" width="46" height="26" rx="13" fill="#2e9e63"/>
  <circle cx="1115" cy="437" r="10" fill="#ffffff"/>
  <rect x="740" y="462" width="406" height="34" rx="9" fill="#ffffff" stroke="#dcdde0"/>
  <text x="756" y="484" font-size="11.5" fill="#1d2430">Nhóm bỏ sỉ miền Bắc</text>
  <rect x="1082" y="466" width="46" height="26" rx="13" fill="#cfd2d8"/>
  <circle cx="1095" cy="479" r="10" fill="#ffffff"/>
  <rect x="740" y="504" width="406" height="34" rx="9" fill="#ffffff" stroke="#dcdde0"/>
  <text x="756" y="526" font-size="11.5" fill="#1d2430">Anh Tuấn — đối tác</text>
  <rect x="1082" y="508" width="46" height="26" rx="13" fill="#cfd2d8"/>
  <circle cx="1095" cy="521" r="10" fill="#ffffff"/>
  <rect x="740" y="552" width="406" height="44" rx="10" fill="#fffaf2" stroke="#f0d9ae"/>
  <text x="756" y="571" font-size="11" font-weight="700" fill="#e2653a">Mặc định bot chỉ trả lời người bạn tự chọn</text>
  <text x="756" y="587" font-size="10.5" fill="#66707e">Trả lời nhầm đối tác phiền hơn là chậm một tin</text>
  <rect x="734" y="232" width="418" height="108" rx="16" fill="none" stroke="#f59e0b" stroke-width="3"/>
</svg>
