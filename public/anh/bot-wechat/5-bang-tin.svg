  <text x="152" y="116" font-size="33" font-weight="700" fill="#241a3d">Đăng bài lên Bảng tin</text>
  <text x="56" y="186" font-size="20.5" fill="#584f6e"><tspan>Chọn ảnh, viết nội dung, đặt giờ đăng.</tspan></text>
