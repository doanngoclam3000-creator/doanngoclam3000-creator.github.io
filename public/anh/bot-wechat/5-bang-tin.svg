  <text x="56" y="408" font-size="20.5" fill="#584f6e"><tspan>nhận lệnh gửi ngầm cho việc này, xong trả con trỏ về</tspan></text>
  <text x="56" y="445" font-size="20.5" fill="#584f6e"><tspan>đúng chỗ cũ ngay.</tspan></text>
