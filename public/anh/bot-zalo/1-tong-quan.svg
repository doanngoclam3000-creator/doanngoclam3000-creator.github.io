<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <linearGradient id="nen" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#eaf1ff"/><stop offset="100%" stop-color="#dbe6ff"/>
  </linearGradient>
  <filter id="bong" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#123a7a" flood-opacity="0.20"/>
  </filter>
</defs>
<rect width="1200" height="760" fill="url(#nen)"/>
<g>
  <circle cx="96" cy="104" r="34" fill="#2b7cff"/>
  <text x="96" y="116" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">💬</text>
  <text x="152" y="116" font-size="33" font-weight="700" fill="#12294d">Bot Zalo — một màn hình, đủ việc bán hàng</text>
  <text x="56" y="186" font-size="20.5" fill="#3f5170"><tspan>Bật công tắc từng việc, bot chạy </tspan><tspan font-weight="700" fill="#12294d">ngay trên máy bạn</tspan><tspan>.</tspan></text>
  <text x="56" y="223" font-size="20.5" fill="#3f5170">Dữ liệu khách nằm trong máy, không qua máy chủ trung gian.</text>
</g>
<g filter="url(#bong)">
  <rect x="56" y="280" width="1088" height="420" rx="24" fill="#ffffff"/>
  <rect x="56" y="280" width="1088" height="70" rx="24" fill="#2b7cff"/>
  <rect x="56" y="326" width="1088" height="24" fill="#2b7cff"/>
  <text x="88" y="324" font-size="21" font-weight="700" fill="#ffffff">Bảng điều khiển</text>
  <circle cx="1096" cy="315" r="12" fill="#ffffff" opacity="0.25"/>
</g>
<g font-size="17">
  <!-- 6 the chuc nang -->
  <g>
    <rect x="88" y="380" width="330" height="86" rx="14" fill="#f3f7ff" stroke="#d6e3ff"/>
    <text x="110" y="416" font-size="26">👥</text>
    <text x="150" y="412" font-size="18" font-weight="700" fill="#12294d">Quét thành viên nhóm</text>
    <text x="150" y="438" font-size="14.5" fill="#5b6b86">Cả cộng đồng nghìn người</text>
  </g>
  <g>
    <rect x="435" y="380" width="330" height="86" rx="14" fill="#f3f7ff" stroke="#d6e3ff"/>
    <text x="457" y="416" font-size="26">🤝</text>
    <text x="497" y="412" font-size="18" font-weight="700" fill="#12294d">Kết bạn &amp; nhắn hàng loạt</text>
    <text x="497" y="438" font-size="14.5" fill="#5b6b86">Chèn {ten}, gửi kèm ảnh</text>
  </g>
  <g>
    <rect x="782" y="380" width="330" height="86" rx="14" fill="#f3f7ff" stroke="#d6e3ff"/>
    <text x="804" y="416" font-size="26">📢</text>
    <text x="844" y="412" font-size="18" font-weight="700" fill="#12294d">Đăng bài nhiều nhóm</text>
    <text x="844" y="438" font-size="14.5" fill="#5b6b86">Giãn cách an toàn</text>
  </g>
  <g>
    <rect x="88" y="480" width="330" height="86" rx="14" fill="#f3f7ff" stroke="#d6e3ff"/>
    <text x="110" y="516" font-size="26">⏰</text>
    <text x="150" y="512" font-size="18" font-weight="700" fill="#12294d">Hẹn giờ tự gửi</text>
    <text x="150" y="538" font-size="14.5" fill="#5b6b86">Một lần hoặc lặp hằng ngày</text>
  </g>
  <g>
    <rect x="435" y="480" width="330" height="86" rx="14" fill="#f3f7ff" stroke="#d6e3ff"/>
    <text x="457" y="516" font-size="26">➕</text>
    <text x="497" y="512" font-size="18" font-weight="700" fill="#12294d">Mời vào nhóm</text>
    <text x="497" y="538" font-size="14.5" fill="#5b6b86">Kéo bạn bè theo từng đợt</text>
  </g>
  <g>
    <rect x="782" y="480" width="330" height="86" rx="14" fill="#f3f7ff" stroke="#d6e3ff"/>
    <text x="804" y="516" font-size="26">📍</text>
    <text x="844" y="512" font-size="18" font-weight="700" fill="#12294d">Tìm khách Google Maps</text>
    <text x="844" y="538" font-size="14.5" fill="#5b6b86">Lấy tên, SĐT, địa chỉ</text>
  </g>
  <g>
    <rect x="88" y="580" width="1024" height="86" rx="14" fill="#eefaf1" stroke="#c7ecd2"/>
    <text x="112" y="628" font-size="26">💬</text>
    <text x="152" y="616" font-size="18" font-weight="700" fill="#12294d">Xem và trả lời tin nhắn ngay trong phần mềm</text>
    <text x="152" y="642" font-size="14.5" fill="#5b6b86">Nhiều tài khoản Zalo, mỗi tài khoản một phiên riêng</text>
  </g>
</g>
</svg>
