  <text x="152" y="116" font-size="33" font-weight="700" fill="#241a3d">Nhận cả iPhone lẫn Android</text>
  <text x="56" y="186" font-size="20.5" fill="#584f6e"><tspan>Cắm cáp vào là phần mềm tự nhận máy.</tspan></text>
  <text x="56" y="260" font-size="20.5" fill="#584f6e"><tspan>Với </tspan><tspan font-weight="700" fill="#241a3d">iPhone</tspan><tspan>: bật Chế độ nhà phát triển một lần đầu.</tspan></text>
  <text x="56" y="297" font-size="20.5" fill="#584f6e"><tspan>Với </tspan><tspan font-weight="700" fill="#241a3d">Android</tspan><tspan>: bật Gỡ lỗi USB, phần mềm tự cài</tspan></text>
  <text x="56" y="334" font-size="20.5" fill="#584f6e"><tspan>ứng dụng phụ trợ lên máy, bạn không phải tải gì thêm.</tspan></text>
  <text x="56" y="408" font-size="20.5" fill="#584f6e"><tspan>Cắm nhiều máy cùng lúc cũng được, chọn máy nào</tspan></text>
  <text x="56" y="445" font-size="20.5" fill="#584f6e"><tspan>muốn đổi vị trí ở danh sách bên trái.</tspan></text>
</g>
