  <text x="152" y="116" font-size="33" font-weight="700" fill="#241a3d">Chọn vị trí trên bản đồ</text>
  <text x="56" y="186" font-size="20.5" fill="#584f6e"><tspan>Cắm cáp iPhone hoặc máy Android vào máy tính,</tspan></text>
