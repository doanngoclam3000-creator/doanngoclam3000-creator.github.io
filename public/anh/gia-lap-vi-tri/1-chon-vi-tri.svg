  <text x="56" y="297" font-size="20.5" fill="#584f6e"><tspan font-weight="700" fill="#241a3d">Bấm thẳng vào bản đồ</tspan><tspan> là đổi vị trí luôn,</tspan></text>
  <text x="56" y="334" font-size="20.5" fill="#584f6e"><tspan>không phải bấm thêm nút xác nhận.</tspan></text>
  <text x="56" y="408" font-size="20.5" fill="#584f6e"><tspan>Hoặc gõ tên địa điểm vào ô tìm kiếm.</tspan></text>
