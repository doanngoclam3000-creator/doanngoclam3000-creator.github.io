<rect width="1200" height="760" fill="url(#nenAnh)"/>
<g>
  <circle cx="96" cy="104" r="34" fill="#7c3aed"/>
  <text x="96" y="116" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="152" y="116" font-size="33" font-weight="700" fill="#241a3d">Mô phỏng di chuyển</text>
  <text x="56" y="186" font-size="20.5" fill="#584f6e"><tspan>Không chỉ đứng yên một chỗ — vẽ một tuyến đường</tspan></text>
  <text x="56" y="223" font-size="20.5" fill="#584f6e"><tspan>trên bản đồ rồi chọn tốc độ:</tspan></text>
  <text x="56" y="297" font-size="20.5" fill="#584f6e"><tspan font-weight="700" fill="#241a3d">đi bộ · chạy bộ · xe máy · ô tô</tspan></text>
  <text x="56" y="371" font-size="20.5" fill="#584f6e"><tspan>Vị trí sẽ nhích dần theo tuyến như đang đi thật.</tspan></text>
  <text x="56" y="445" font-size="20.5" fill="#584f6e"><tspan>Muốn về vị trí thật thì bấm một nút là xong.</tspan></text>
</g>
