<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <linearGradient id="nenAnh" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8f5ff"/><stop offset="100%" stop-color="#ece3fb"/>
  </linearGradient>
  <filter id="bong" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#3b2560" flood-opacity="0.22"/>
  </filter>
  <filter id="bongnho" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#3b2560" flood-opacity="0.16"/>
