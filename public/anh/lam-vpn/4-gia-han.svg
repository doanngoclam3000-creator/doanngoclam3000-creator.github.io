<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <linearGradient id="nen4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#eef4ff"/><stop offset="100%" stop-color="#dbe6ff"/></linearGradient>
  <linearGradient id="xanh4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0b5fff"/><stop offset="100%" stop-color="#3d84ff"/></linearGradient>
  <linearGradient id="luc4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#12a150"/></linearGradient>
  <filter id="bong4" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0a2a6b" flood-opacity="0.22"/></filter>
</defs>
<rect width="1200" height="760" fill="url(#nen4)"/>

<circle cx="96" cy="104" r="34" fill="url(#xanh4)"/>
<text x="96" y="116" font-size="30" text-anchor="middle">📅</text>
<text x="152" y="112" font-size="33" font-weight="700" fill="#0a1f4d">Gia hạn thì ngày cộng dồn, không mất ngày thừa</text>
<text x="56" y="170" font-size="20.5" fill="#41527a">Mua thêm mã rồi nhập vào app. Số ngày mới cộng vào số ngày còn lại, không đè lên.</text>

<g filter="url(#bong4)">
  <rect x="56" y="212" width="1088" height="196" rx="20" fill="#ffffff"/>

  <text x="112" y="266" font-size="17" fill="#8b98b8">Đang còn</text>
  <rect x="112" y="284" width="180" height="72" rx="14" fill="#fff5e6"/>
  <text x="202" y="330" font-size="27" font-weight="700" fill="#c77700" text-anchor="middle">5 ngày</text>

  <text x="332" y="330" font-size="38" font-weight="700" fill="#8b98b8">+</text>

  <text x="392" y="266" font-size="17" fill="#8b98b8">Nhập thêm mã</text>
  <rect x="392" y="284" width="200" height="72" rx="14" fill="#e6efff"/>
  <text x="492" y="330" font-size="27" font-weight="700" fill="#0b5fff" text-anchor="middle">30 ngày</text>

  <text x="632" y="330" font-size="38" font-weight="700" fill="#8b98b8">=</text>

  <text x="692" y="266" font-size="17" fill="#8b98b8">Thành</text>
  <rect x="692" y="284" width="200" height="72" rx="14" fill="url(#luc4)"/>
  <text x="792" y="330" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">35 ngày</text>

  <text x="940" y="306" font-size="17" fill="#5b6b8f">Không phải chờ hết hạn</text>
  <text x="940" y="334" font-size="17" fill="#5b6b8f">mới được gia hạn.</text>
</g>

<g filter="url(#bong4)">
  <rect x="56" y="432" width="530" height="120" rx="18" fill="#ffffff"/>
  <text x="92" y="482" font-size="26">👆</text>
  <text x="138" y="478" font-size="20" font-weight="700" fill="#0a1f4d">Gia hạn ngay trong app</text>
  <text x="138" y="510" font-size="16.5" fill="#5b6b8f">Ở trang chính, bấm vào dòng “Hết hạn” là hiện ô nhập mã.</text>
  <text x="138" y="534" font-size="16.5" fill="#5b6b8f">Không phải gỡ app, không phải nhắn cho ai.</text>
</g>

<g filter="url(#bong4)">
  <rect x="614" y="432" width="530" height="120" rx="18" fill="#ffffff"/>
  <text x="650" y="482" font-size="26">🔁</text>
  <text x="696" y="478" font-size="20" font-weight="700" fill="#0a1f4d">Đổi máy được, không mất phí</text>
  <text x="696" y="510" font-size="16.5" fill="#5b6b8f">Một mã dùng trên một máy tại một thời điểm.</text>
  <text x="696" y="534" font-size="16.5" fill="#5b6b8f">Đổi điện thoại thì nhắn cho chúng tôi nhả suất cũ.</text>
</g>

<g filter="url(#bong4)">
  <rect x="56" y="576" width="1088" height="132" rx="18" fill="#0a1f4d"/>
  <text x="96" y="632" font-size="26">🔕</text>
  <text x="144" y="626" font-size="20" font-weight="700" fill="#ffffff">Hết hạn thì app tự ngắt — không âm thầm trừ tiền</text>
  <text x="144" y="660" font-size="16.5" fill="#a9bde8">Không tự động gia hạn, không lưu thẻ, không trừ tiền lặp lại. Bạn muốn dùng tiếp thì mua thêm mã.</text>
  <text x="144" y="686" font-size="16.5" fill="#a9bde8">Chúng tôi cũng không giữ thông tin thanh toán nào của bạn.</text>
</g>
</svg>
