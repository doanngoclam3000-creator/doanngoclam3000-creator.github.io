  <text x="152" y="116" font-size="33" font-weight="700" fill="#241a3d">Kho Trung Quốc và vận đơn</text>
  <text x="56" y="186" font-size="20.5" fill="#584f6e"><tspan>Lưu sẵn </tspan><tspan font-weight="700" fill="#241a3d">địa chỉ kho bên Trung Quốc</tspan><tspan>. Lúc đặt hàng</tspan></text>
