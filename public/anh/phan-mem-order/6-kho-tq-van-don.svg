  <text x="56" y="334" font-size="20.5" fill="#584f6e"><tspan>Hàng về thì nhập </tspan><tspan font-weight="700" fill="#241a3d">mã vận đơn</tspan><tspan> vào đơn tương ứng.</tspan></text>
  <text x="56" y="371" font-size="20.5" fill="#584f6e"><tspan>Mục </tspan><tspan font-weight="700" fill="#241a3d">Tra kiện hàng</tspan><tspan> quét mã là ra ngay tên khách —</tspan></text>
  <text x="56" y="408" font-size="20.5" fill="#584f6e"><tspan>khỏi phải mở sổ dò.</tspan></text>
