  <text x="56" y="408" font-size="20.5" fill="#584f6e"><tspan>Thêm phí ship, cước cân ở mục </tspan><tspan font-weight="700" fill="#241a3d">Chi phí</tspan><tspan> —</tspan></text>
  <text x="56" y="445" font-size="20.5" fill="#584f6e"><tspan>phần mềm chia đều về từng mã, không phải tính tay.</tspan></text>
